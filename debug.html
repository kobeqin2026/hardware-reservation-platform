<template>
  <div style="padding:20px;">
    <h3>Debug TeamView</h3>
    <p>Path: {{ path }}</p>
    <p v-if="err" style="color:red;">{{ err }}</p>
    <div v-if="data">
      <p>Platforms: {{ data.platforms }}</p>
      <p>Stages: {{ data.stages }}</p>
      <p>Overview: {{ data.overview }}</p>
    </div>
  </div>
</template>
<script setup>
import { ref, onMounted } from 'vue'
import { useRoute } from 'vue-router'
const path = useRoute().path
const data = ref(null)
const err = ref(null)
onMounted(async () => {
  try {
    const r1 = await fetch('/api/platforms').then(r => r.text())
    const r2 = await fetch('/api/stages').then(r => r.text())
    const r3 = await fetch('/api/reservations/overview').then(r => r.text())
    data.value = { platforms: r1.length + ' bytes', stages: r2.length + ' bytes', overview: r3.length + ' bytes' }
  } catch(e) { err.value = e.message }
})
</script>
